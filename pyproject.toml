[project]
name = "sp500-analytics"
version = "0.1.0"
description = "S&P 500 and extras stock data pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "yfinance>=0.2.36",
    "requests>=2.31.0",
    "lxml>=4.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]
